<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Employees | Lodgings Resto')}"></head>
<body>
<div class="app-shell">
    <aside class="sidebar collapse d-lg-block" id="sidebarCollapse" th:replace="~{fragments/layout :: sidebar('employees')}"></aside>
    <div class="content-shell">
        <header th:replace="~{fragments/layout :: topbar('Employees', @{/employees}, ${search}, 'Search employees, department, phone...')}"></header>
        <main class="page-body">
            <section class="glass-card p-4 mb-4">
                <div class="section-header">
                    <div>
                        <div class="eyebrow">Employee management</div>
                        <h2 class="mb-0">Create a team member record</h2>
                    </div>
                </div>
                <form th:action="@{/employees}" th:object="${employee}" method="post" class="row g-3 mt-1">
                    <div class="col-md-6"><input th:field="*{name}" class="form-control form-control-premium" placeholder="Employee name"></div>
                    <div class="col-md-6"><input th:field="*{department}" class="form-control form-control-premium" placeholder="Department"></div>
                    <div class="col-md-6"><input th:field="*{position}" class="form-control form-control-premium" placeholder="Position"></div>
                    <div class="col-md-6"><input th:field="*{phoneNumber}" class="form-control form-control-premium" placeholder="Phone number"></div>
                    <div class="col-md-6"><input th:field="*{salary}" type="number" step="0.01" class="form-control form-control-premium" placeholder="Salary"></div>
                    <div class="col-12 text-end"><button class="btn btn-premium" type="submit">Save Employee</button></div>
                </form>
            </section>

            <section class="glass-card p-4">
                <div class="section-header">
                    <div>
                        <div class="eyebrow">Employee directory</div>
                        <h2 class="mb-0">All employees</h2>
                    </div>
                </div>
                <div class="table-responsive premium-table-wrap mt-3">
                    <table class="table premium-table mb-0">
                        <thead><tr><th>Name</th><th>Dept</th><th>Position</th><th>Phone</th><th>Salary</th><th>Actions</th></tr></thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(employees)}"><td colspan="6" class="text-center py-5">No employees found.</td></tr>
                        <tr th:each="e : ${employees}">
                            <td data-label="Name" th:text="${e.name}">Name</td>
                            <td data-label="Dept" th:text="${e.department}">Dept</td>
                            <td data-label="Position" th:text="${e.position}">Position</td>
                            <td data-label="Phone" th:text="${e.phoneNumber}">Phone</td>
                            <td data-label="Salary" class="price-cell" th:text="${'₹' + e.salary}">₹0</td>
                            <td data-label="Actions">
                                <div class="action-group justify-content-end">
                                    <a th:href="@{/employees/{id}/edit(id=${e.id})}" class="btn btn-edit btn-action"><i class="fa-solid fa-pen-to-square"></i></a>
                                    <form th:action="@{/employees/{id}/delete(id=${e.id})}" method="post" onsubmit="return confirm('Delete this employee?');">
                                        <button class="btn btn-delete btn-action" type="submit"><i class="fa-solid fa-trash"></i></button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: flashToasts}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
