<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employees - Lodgings Resto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/app.js}"></script>
</head>
<body>
<div class="app-shell">
    <div class="content-shell">
        <header class="topbar"><h1 class="page-title">Employees</h1></header>
        <main class="page-body">
            <section class="glass-card">
                <div class="d-flex justify-content-between align-items-center">
                    <h3>Team Members</h3>
                    <a href="/employees/new" class="btn btn-premium">Add Employee</a>
                </div>
                <div class="table-responsive mt-3">
                    <table class="table premium-table">
                        <thead><tr><th>Name</th><th>Dept</th><th>Position</th><th>Phone</th><th>Salary</th><th>Actions</th></tr></thead>
                        <tbody>
                        <tr th:each="e : ${employees}">
                            <td th:text="${e.name}">Name</td>
                            <td th:text="${e.department}">Dept</td>
                            <td th:text="${e.position}">Position</td>
                            <td th:text="${e.phoneNumber}">Phone</td>
                            <td th:text="${e.salary}">0</td>
                            <td>
                                <form th:action="@{/employees/{id}/delete(id=${e.id})}" method="post">
                                    <button class="btn btn-delete btn-action" type="submit"><i class="fa-solid fa-trash"></i></button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</div>
</body>
</html>
