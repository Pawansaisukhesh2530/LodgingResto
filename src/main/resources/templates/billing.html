<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing - Lodgings Resto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
    <div class="content-shell">
        <header class="topbar"><h1 class="page-title">Billing & Payment</h1></header>
        <main class="page-body">
            <section class="glass-card p-4 mb-4">
                <div class="section-header">
                    <div>
                        <div class="eyebrow">Invoice summary</div>
                        <h2 class="mb-0">Billing dashboard</h2>
                    </div>
                    <span class="badge bg-primary rounded-pill px-3 py-2">Production style</span>
                </div>
                <div class="row g-3 mt-2">
                    <div class="col-md-4"><div class="stat-mini-card"><span>Room Revenue</span><strong th:text="${'₹' + revenue}">₹0</strong></div></div>
                    <div class="col-md-4"><div class="stat-mini-card"><span>Tax (18%)</span><strong th:text="${'₹' + tax}">₹0</strong></div></div>
                    <div class="col-md-4"><div class="stat-mini-card"><span>Grand Total</span><strong th:text="${'₹' + total}">₹0</strong></div></div>
                </div>
            </section>

            <section class="glass-card p-4">
                <h4 class="mb-3">Payment Methods</h4>
                <div class="d-flex flex-wrap gap-2">
                    <span th:each="m : ${methods}" class="status-chip" th:text="${m}">Cash</span>
                </div>
            </section>
        </main>
    </div>
</div>
</body>
</html>
