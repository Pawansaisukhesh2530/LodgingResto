<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Billing | Lodgings Resto')}"></head>
<body>
<div class="app-shell">
    <aside class="sidebar collapse d-lg-block" id="sidebarCollapse" th:replace="~{fragments/layout :: sidebar('billing')}"></aside>
    <div class="content-shell">
        <header th:replace="~{fragments/layout :: topbar('Billing & Payment', @{/billing}, null, null)}"></header>
        <main class="page-body">
            <section class="glass-card p-4 mb-4">
                <div class="section-header">
                    <div>
                        <div class="eyebrow">Invoice summary</div>
                        <h2 class="mb-0">Billing dashboard</h2>
                    </div>
                    <span class="badge bg-primary rounded-pill px-3 py-2">Production style</span>
                </div>
                <div class="row g-3 mt-2">
                    <div class="col-md-4"><div class="stat-mini-card"><span>Revenue</span><strong th:text="${revenue}">$0</strong></div></div>
                    <div class="col-md-4"><div class="stat-mini-card"><span>Tax</span><strong th:text="${tax}">$0</strong></div></div>
                    <div class="col-md-4"><div class="stat-mini-card"><span>Grand Total</span><strong th:text="${total}">$0</strong></div></div>
                </div>
            </section>

            <section class="glass-card p-4 mb-4">
                <div class="section-header mb-3">
                    <div>
                        <div class="eyebrow">Create invoice</div>
                        <h2 class="mb-0">Generate room or restaurant bill</h2>
                    </div>
                </div>
                <form th:action="@{/billing}" th:object="${invoice}" method="post" class="row g-3">
                    <div class="col-md-4">
                        <select name="reservationId" class="form-select form-select-premium">
                            <option value="">Select reservation</option>
                            <option th:each="r : ${reservations}" th:value="${r.id}" th:text="${r.guest != null ? r.guest.fullName + ' / ' + r.room.roomNumber : r.id}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <select name="orderId" class="form-select form-select-premium">
                            <option value="">Select restaurant order</option>
                            <option th:each="o : ${orders}" th:value="${o.id}" th:text="${'Order #' + o.id + ' / ' + o.total}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <select th:field="*{invoiceType}" class="form-select form-select-premium">
                            <option value="">Invoice type</option>
                            <option th:each="type : ${invoiceTypes}" th:value="${type}" th:text="${type}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <select th:field="*{paymentMethod}" class="form-select form-select-premium">
                            <option th:each="m : ${methods}" th:value="${m}" th:text="${m}"></option>
                        </select>
                    </div>
                    <div class="col-12"><textarea th:field="*{notes}" class="form-control textarea-premium" placeholder="Invoice notes"></textarea></div>
                    <div class="col-12 text-end"><button class="btn btn-premium" type="submit">Generate Invoice</button></div>
                </form>
            </section>

            <section class="glass-card p-4">
                <div class="section-header mb-3">
                    <div>
                        <div class="eyebrow">Invoice history</div>
                        <h2 class="mb-0">Recent invoices</h2>
                    </div>
                </div>
                <div class="table-responsive premium-table-wrap">
                    <table class="table premium-table mb-0">
                        <thead><tr><th>Invoice #</th><th>Type</th><th>Method</th><th>Subtotal</th><th>Tax</th><th>Total</th></tr></thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(invoices)}"><td colspan="6" class="text-center py-5">No invoices found.</td></tr>
                        <tr th:each="i : ${invoices}">
                            <td data-label="Invoice #" th:text="${i.invoiceNumber}">INV</td>
                            <td data-label="Type" th:text="${i.invoiceType}">ROOM</td>
                            <td data-label="Method" th:text="${i.paymentMethod}">CASH</td>
                            <td data-label="Subtotal" th:text="${i.subtotal}">$0</td>
                            <td data-label="Tax" th:text="${i.taxAmount}">$0</td>
                            <td data-label="Total" th:text="${i.totalAmount}">$0</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: flashToasts}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
