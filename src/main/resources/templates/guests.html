<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guests - Lodgings Resto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/app.js}"></script>
</head>
<body>
<div class="app-shell">
    <!-- sidebar + topbar are included inline in other templates; simplified here -->
    <div class="content-shell">
        <header class="topbar">
            <div class="d-flex align-items-center gap-3">
                <h1 class="page-title">Guests</h1>
            </div>
        </header>
        <main class="page-body">
            <section class="glass-card">
                <div class="section-header d-flex justify-content-between align-items-center">
                    <h3>Guest Directory</h3>
                    <a href="/guests/new" class="btn btn-premium">Add Guest</a>
                </div>
                <div class="table-responsive mt-3">
                    <table class="table premium-table">
                        <thead>
                        <tr><th>Name</th><th>Phone</th><th>Email</th><th>Actions</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="g : ${guests}">
                            <td th:text="${g.fullName}">Name</td>
                            <td th:text="${g.phoneNumber}">Phone</td>
                            <td th:text="${g.email}">Email</td>
                            <td>
                                <form th:action="@{/guests/{id}/delete(id=${g.id})}" method="post">
                                    <button class="btn btn-delete btn-action" type="submit"><i class="fa-solid fa-trash"></i></button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</div>
</body>
</html>
