<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Guests | Lodgings Resto')}"></head>
<body>
<div class="app-shell">
    <aside class="sidebar collapse d-lg-block" id="sidebarCollapse" th:replace="~{fragments/layout :: sidebar('guests')}"></aside>
    <div class="content-shell">
        <header th:replace="~{fragments/layout :: topbar('Guests', @{/guests}, ${search}, 'Search guests, phone, email...')}"></header>
        <main class="page-body">
            <section class="glass-card p-4 mb-4">
                <div class="section-header">
                    <div>
                        <div class="eyebrow">Guest management</div>
                        <h2 class="mb-0">Create a guest record</h2>
                    </div>
                </div>
                <form th:action="@{/guests}" th:object="${guest}" method="post" class="row g-3 mt-1">
                    <div class="col-md-6"><input th:field="*{fullName}" class="form-control form-control-premium" placeholder="Full name"></div>
                    <div class="col-md-6"><input th:field="*{phoneNumber}" class="form-control form-control-premium" placeholder="Phone number"></div>
                    <div class="col-md-6"><input th:field="*{email}" class="form-control form-control-premium" placeholder="Email"></div>
                    <div class="col-md-6"><input th:field="*{idProofNumber}" class="form-control form-control-premium" placeholder="ID proof number"></div>
                    <div class="col-12"><textarea th:field="*{address}" class="form-control textarea-premium" placeholder="Address"></textarea></div>
                    <div class="col-12 text-end"><button class="btn btn-premium" type="submit">Save Guest</button></div>
                </form>
            </section>

            <section class="glass-card p-4">
                <div class="section-header">
                    <div>
                        <div class="eyebrow">Guest directory</div>
                        <h2 class="mb-0">All guests</h2>
                    </div>
                </div>
                <div class="table-responsive premium-table-wrap mt-3">
                    <table class="table premium-table mb-0">
                        <thead>
                        <tr><th>Name</th><th>Phone</th><th>Email</th><th>Address</th><th>Actions</th></tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(guests)}"><td colspan="5" class="text-center py-5">No guests found.</td></tr>
                        <tr th:each="g : ${guests}">
                            <td data-label="Name" th:text="${g.fullName}">Name</td>
                            <td data-label="Phone" th:text="${g.phoneNumber}">Phone</td>
                            <td data-label="Email" th:text="${g.email}">Email</td>
                            <td data-label="Address" th:text="${g.address}">Address</td>
                            <td data-label="Actions">
                                <div class="action-group justify-content-end">
                                    <a th:href="@{/guests/{id}/edit(id=${g.id})}" class="btn btn-edit btn-action"><i class="fa-solid fa-pen-to-square"></i></a>
                                    <form th:action="@{/guests/{id}/delete(id=${g.id})}" method="post" onsubmit="return confirm('Delete this guest?');">
                                        <button class="btn btn-delete btn-action" type="submit"><i class="fa-solid fa-trash"></i></button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: flashToasts}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
