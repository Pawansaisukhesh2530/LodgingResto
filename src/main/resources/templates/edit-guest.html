<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Edit Guest | Lodgings Resto')}"></head>
<body>
<div class="app-shell">
    <aside class="sidebar collapse d-lg-block" id="sidebarCollapse" th:replace="~{fragments/layout :: sidebar('guests')}"></aside>
    <div class="content-shell">
        <header th:replace="~{fragments/layout :: topbar('Edit Guest', @{/guests}, null, null)}"></header>
        <main class="page-body">
            <section class="glass-card p-4 form-card mx-auto">
                <div class="section-header mb-4">
                    <div>
                        <div class="eyebrow">Guest update</div>
                        <h2 class="mb-0">Edit guest</h2>
                    </div>
                    <a th:href="@{/guests}" class="btn btn-outline-light btn-back-link">Back to Guests</a>
                </div>
                <form th:action="@{/guests/{id}(id=${guest.id})}" th:object="${guest}" method="post" class="row g-3">
                    <input type="hidden" name="_method" value="put">
                    <div class="col-md-6"><input th:field="*{fullName}" class="form-control form-control-premium" placeholder="Full name"></div>
                    <div class="col-md-6"><input th:field="*{phoneNumber}" class="form-control form-control-premium" placeholder="Phone number"></div>
                    <div class="col-md-6"><input th:field="*{email}" class="form-control form-control-premium" placeholder="Email"></div>
                    <div class="col-md-6"><input th:field="*{idProofNumber}" class="form-control form-control-premium" placeholder="ID proof number"></div>
                    <div class="col-12"><textarea th:field="*{address}" class="form-control textarea-premium" placeholder="Address"></textarea></div>
                    <div class="col-12 text-end"><button class="btn btn-premium" type="submit">Update Guest</button></div>
                </form>
            </section>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: flashToasts}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
