<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Inventory | Lodgings Resto')}"></head>
<body>
<div class="app-shell">
    <aside class="sidebar collapse d-lg-block" id="sidebarCollapse" th:replace="~{fragments/layout :: sidebar('inventory')}"></aside>
    <div class="content-shell">
        <header th:replace="~{fragments/layout :: topbar('Inventory', @{/inventory}, ${search}, 'Search inventory items, supplier...')}"></header>
        <main class="page-body">
            <section class="glass-card p-4 mb-4">
                <div class="section-header">
                    <div>
                        <div class="eyebrow">Stock management</div>
                        <h2 class="mb-0">Add inventory item</h2>
                    </div>
                    <div>
                        <a href="#addItem" class="btn btn-outline-light me-2" data-bs-toggle="modal">Add Item</a>
                        <a href="#addSupplier" class="btn btn-premium" data-bs-toggle="modal">Add Supplier</a>
                    </div>
                </div>
                <div class="table-responsive premium-table-wrap mt-3">
                    <table class="table premium-table mb-0">
                        <thead><tr><th>Name</th><th>Qty</th><th>Supplier</th><th>Actions</th></tr></thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(items)}"><td colspan="4" class="text-center py-5">No inventory items found.</td></tr>
                        <tr th:each="it : ${items}">
                            <td data-label="Name" th:text="${it.name}">Item</td>
                            <td data-label="Qty" th:text="${it.quantity}">0</td>
                            <td data-label="Supplier" th:text="${it.supplier != null ? it.supplier.name : '-'}">Supplier</td>
                            <td data-label="Actions">
                                <div class="action-group justify-content-end">
                                    <a th:href="@{/inventory/{id}/edit(id=${it.id})}" class="btn btn-edit btn-action"><i class="fa-solid fa-pen-to-square"></i></a>
                                    <form th:action="@{/inventory/items/{id}/delete(id=${it.id})}" method="post" onsubmit="return confirm('Delete this item?');">
                                        <button class="btn btn-delete btn-action" type="submit"><i class="fa-solid fa-trash"></i></button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <section class="glass-card p-4 mt-4">
                <div class="section-header">
                    <div>
                        <div class="eyebrow">Low stock</div>
                        <h2 class="mb-0">Items below threshold</h2>
                    </div>
                </div>
                <div class="row g-3 mt-2">
                    <div class="col-md-4" th:each="it : ${lowStock}">
                        <div class="stat-mini-card">
                            <span th:text="${it.name}">Item</span>
                            <strong th:text="${it.quantity}">0</strong>
                        </div>
                    </div>
                    <div class="col-12" th:if="${#lists.isEmpty(lowStock)}">
                        <div class="empty-state text-center">
                            <i class="fa-solid fa-circle-check mb-3"></i>
                            <div class="fw-semibold">No low stock alerts right now.</div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
</div>

<div class="modal fade" id="addItem" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content premium-modal p-3">
            <form th:action="@{/inventory/items}" method="post" th:object="${item}">
                <div class="modal-header border-0"><h5 class="modal-title">Add Inventory Item</h5></div>
                <div class="modal-body row g-3">
                    <div class="col-md-6"><input th:field="*{name}" class="form-control form-control-premium" placeholder="Name" required></div>
                    <div class="col-md-6"><input th:field="*{quantity}" type="number" class="form-control form-control-premium" placeholder="Quantity" required></div>
                    <div class="col-12"><textarea th:field="*{description}" class="form-control textarea-premium" placeholder="Description"></textarea></div>
                    <div class="col-12">
                        <select name="supplierId" class="form-select form-select-premium">
                            <option value="">Select supplier</option>
                            <option th:each="sup : ${suppliers}" th:value="${sup.id}" th:text="${sup.name}"></option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer border-0"><button class="btn btn-premium" type="submit">Add</button></div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="addSupplier" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content premium-modal p-3">
            <form th:action="@{/inventory/suppliers}" method="post" th:object="${supplier}">
                <div class="modal-header border-0"><h5 class="modal-title">Add Supplier</h5></div>
                <div class="modal-body">
                    <input th:field="*{name}" class="form-control form-control-premium mb-2" placeholder="Supplier name" required />
                    <input th:field="*{contact}" class="form-control form-control-premium mb-2" placeholder="Contact" />
                    <textarea th:field="*{notes}" class="form-control textarea-premium" placeholder="Notes"></textarea>
                </div>
                <div class="modal-footer border-0"><button class="btn btn-premium" type="submit">Add</button></div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: flashToasts}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
