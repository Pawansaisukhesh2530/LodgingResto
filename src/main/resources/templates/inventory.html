<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory - Lodgings Resto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/app.js}"></script>
</head>
<body>
<div class="app-shell">
    <div class="content-shell">
        <header class="topbar"><h1 class="page-title">Inventory</h1></header>
        <main class="page-body">
            <section class="glass-card">
                <div class="d-flex justify-content-between align-items-center">
                    <h3>Stock Items</h3>
                    <div>
                        <a href="#addItem" class="btn btn-outline-light me-2" data-bs-toggle="modal">Add Item</a>
                        <a href="#addSupplier" class="btn btn-premium" data-bs-toggle="modal">Add Supplier</a>
                    </div>
                </div>
                <div class="mt-3">
                    <div class="table-responsive">
                        <table class="table premium-table">
                            <thead><tr><th>Name</th><th>Qty</th><th>Supplier</th><th>Actions</th></tr></thead>
                            <tbody>
                            <tr th:each="it : ${items}">
                                <td th:text="${it.name}">Item</td>
                                <td th:text="${it.quantity}">0</td>
                                <td th:text="${it.supplier != null ? it.supplier.name : '-'}">Supplier</td>
                                <td></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>
</div>

<!-- Modals -->
<div class="modal fade" id="addItem" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/inventory/items}" method="post">
                <div class="modal-header"><h5 class="modal-title">Add Inventory Item</h5></div>
                <div class="modal-body">
                    <input name="name" class="form-control mb-2" placeholder="Name" required />
                    <input name="quantity" type="number" class="form-control mb-2" placeholder="Quantity" required />
                </div>
                <div class="modal-footer"><button class="btn btn-premium" type="submit">Add</button></div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="addSupplier" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/inventory/suppliers}" method="post">
                <div class="modal-header"><h5 class="modal-title">Add Supplier</h5></div>
                <div class="modal-body">
                    <input name="name" class="form-control mb-2" placeholder="Supplier name" required />
                </div>
                <div class="modal-footer"><button class="btn btn-premium" type="submit">Add</button></div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
