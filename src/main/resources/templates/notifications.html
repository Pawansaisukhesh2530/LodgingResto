<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Lodgings Resto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
    <div class="content-shell">
        <header class="topbar"><h1 class="page-title">Notifications</h1></header>
        <main class="page-body">
            <section class="glass-card p-4">
                <div class="section-header">
                    <div>
                        <div class="eyebrow">Alerts center</div>
                        <h2 class="mb-0">Live operational notifications</h2>
                    </div>
                    <span class="badge bg-danger rounded-pill px-3 py-2">4 Active</span>
                </div>
                <div class="list-group mt-3">
                    <div class="list-group-item d-flex align-items-center gap-3" th:each="n,iter : ${notifications}">
                        <div class="delete-icon-wrap mb-0" style="width:52px;height:52px;">
                            <i class="fa-solid fa-bell"></i>
                        </div>
                        <div>
                            <div class="fw-semibold" th:text="${n}">Notification</div>
                            <div class="small text-muted">Just now</div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
</div>
</body>
</html>
