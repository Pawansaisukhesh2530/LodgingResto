<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Notifications | Lodgings Resto')}"></head>
<body>
<div class="app-shell">
    <aside class="sidebar collapse d-lg-block" id="sidebarCollapse" th:replace="~{fragments/layout :: sidebar('notifications')}"></aside>
    <div class="content-shell">
        <header th:replace="~{fragments/layout :: topbar('Notifications', null, null, null)}"></header>
        <main class="page-body">
            <section class="glass-card p-4">
                <div class="section-header">
                    <div>
                        <div class="eyebrow">Alerts center</div>
                        <h2 class="mb-0">Live operational notifications</h2>
                    </div>
                    <span class="badge bg-danger rounded-pill px-3 py-2" th:text="${#lists.size(notifications)} + ' Active'">0 Active</span>
                </div>
                <div class="list-group mt-3">
                    <div class="list-group-item d-flex align-items-center gap-3" th:each="n : ${notifications}">
                        <div class="delete-icon-wrap mb-0" style="width:52px;height:52px;">
                            <i class="fa-solid" th:classappend="${n.category == 'BOOKING' ? 'fa-calendar-check' : n.category == 'PAYMENT' ? 'fa-credit-card' : n.category == 'INVENTORY' ? 'fa-boxes-stacked' : 'fa-bell'}"></i>
                        </div>
                        <div>
                            <div class="fw-semibold" th:text="${n.message}">Notification</div>
                            <div class="small text-muted" th:text="${#temporals.format(n.createdAt, 'yyyy-MM-dd HH:mm')}">Just now</div>
                        </div>
                    </div>
                    <div th:if="${#lists.isEmpty(notifications)}" class="text-center text-muted py-4">No notifications yet.</div>
                </div>
            </section>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
