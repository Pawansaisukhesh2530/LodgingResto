<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Server Error | Lodgings Resto')}"></head>
<body>
<div class="app-shell">
    <aside class="sidebar collapse d-lg-block" id="sidebarCollapse" th:replace="~{fragments/layout :: sidebar('')}"></aside>
    <div class="content-shell">
        <header th:replace="~{fragments/layout :: topbar('Server Error', null, null, null)}"></header>
        <main class="page-body d-flex align-items-center justify-content-center">
            <section class="glass-card p-5 text-center" style="max-width: 640px;">
                <div class="delete-icon-wrap mx-auto"><i class="fa-solid fa-bug-slash"></i></div>
                <div class="eyebrow">500</div>
                <h1 class="mb-3">Something went wrong on our side</h1>
                <p class="text-muted mb-4" th:text="${errorMessage} ?: 'Please try again or check the logs for more details.'">Please try again.</p>
                <a th:href="@{/dashboard}" class="btn btn-premium px-4">Back to Dashboard</a>
            </section>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
