<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Not Found | Lodgings Resto')}"></head>
<body>
<div class="app-shell">
    <aside class="sidebar collapse d-lg-block" id="sidebarCollapse" th:replace="~{fragments/layout :: sidebar('')}"></aside>
    <div class="content-shell">
        <header th:replace="~{fragments/layout :: topbar('Page Not Found', null, null, null)}"></header>
        <main class="page-body d-flex align-items-center justify-content-center">
            <section class="glass-card p-5 text-center" style="max-width: 640px;">
                <div class="error-icon-wrap mx-auto"><i class="fa-solid fa-triangle-exclamation"></i></div>
                <div class="eyebrow">404</div>
                <h1 class="mb-3">The page you requested does not exist</h1>
                <p class="text-muted mb-4">Please return to the dashboard or use the sidebar to navigate to a valid module.</p>
                <a th:href="@{/dashboard}" class="btn btn-premium px-4">Back to Dashboard</a>
            </section>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
