<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('API Dashboard')"></head>
<body>
<div th:replace="fragments/layout :: sidebar('api-dashboard')"></div>
<div class="main-content p-4">
    <div th:replace="fragments/layout :: topbar('API Dashboard', null, null, null)"></div>
    <div class="container-fluid mt-4">
        <div class="row g-3">
            <div class="col-md-3">
                <div class="card p-3">
                    <div class="small text-muted">Total API Requests</div>
                    <div class="fs-4 fw-semibold" th:text="${totalRequests}">0</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3">
                    <div class="small text-muted">Successful Requests</div>
                    <div class="fs-4 fw-semibold text-success" th:text="${successfulRequests}">0</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3">
                    <div class="small text-muted">Failed Requests</div>
                    <div class="fs-4 fw-semibold text-danger" th:text="${failedRequests}">0</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3">
                    <div class="small text-muted">Most Used Endpoint</div>
                    <div class="fs-6" th:if="${mostUsed.size()>0}" th:text="${mostUsed[0][0]} + ' (' + ${mostUsed[0][1]} + ')'">/api/bookings</div>
                    <div class="fs-6" th:if="${mostUsed.size()==0}">-</div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-12">
                <div class="card p-3">
                    <canvas id="apiChart" data-labels="Requests" data-values="[[${totalRequests}]]" height="80"></canvas>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-lg-6">
                <div class="card p-3">
                    <h5>Recent API Calls</h5>
                    <table class="table table-striped mt-3">
                        <thead><tr><th>Time</th><th>Endpoint</th><th>Method</th><th>Status</th><th>User</th></tr></thead>
                        <tbody>
                        <tr th:each="c : ${recentCalls}">
                            <td th:text="${#dates.format(c.requestTime, 'yyyy-MM-dd HH:mm:ss')}"></td>
                            <td th:text="${c.endpoint}"></td>
                            <td th:text="${c.method}"></td>
                            <td th:text="${c.responseStatus}"></td>
                            <td th:text="${c.username}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="card p-3">
                    <h5>Endpoints Usage</h5>
                    <table class="table mt-3">
                        <thead><tr><th>Endpoint</th><th>Count</th></tr></thead>
                        <tbody>
                        <tr th:each="r : ${mostUsed}">
                            <td th:text="${r[0]}"></td>
                            <td th:text="${r[1]}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="fragments/layout :: footer"></div>
</div>
<div th:replace="fragments/layout :: scripts"></div>
<script>
    const canvas = document.getElementById('apiChart');
    if (canvas) {
        const ctx = canvas.getContext('2d');
        new Chart(ctx, { type: 'doughnut', data: { labels: ['Total'], datasets: [{ data: [Number(canvas.dataset.values || 0)], backgroundColor: ['#4e73df'] }] } });
    }
</script>
</body>
</html>
