<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Lodgings Resto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        body { background: linear-gradient(135deg,#0f172a 0%, #23303f 100%); font-family: Inter, system-ui, Arial; }
        .login-card { max-width: 420px; margin: 8vh auto; background: rgba(255,255,255,0.03); border-radius: 12px; padding: 28px; color: #fff; box-shadow: 0 8px 30px rgba(2,6,23,0.6); }
        .brand { font-size: 1.25rem; font-weight:700; }
        .form-control { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); color: #fff; }
        .form-control::placeholder { color: rgba(255,255,255,0.5); }
        .btn-premium { background: linear-gradient(90deg,#6d28d9,#ec4899); border: none; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="text-center mb-4">
        <div class="brand"><i class="fa-solid fa-hotel me-2"></i>Lodgings Resto</div>
        <div class="small text-muted">Sign in to your dashboard</div>
    </div>

    <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input name="username" type="text" class="form-control" placeholder="admin" required />
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input name="password" type="password" class="form-control" placeholder="password" required />
        </div>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div></div>
            <a th:href="@{/login?logout}" class="text-white-50 small">Forgot?</a>
        </div>
        <div class="d-grid">
            <button class="btn btn-premium btn-lg text-white" type="submit"><i class="fa-solid fa-right-to-bracket me-2"></i>Sign In</button>
        </div>
    </form>
    <div class="mt-3 small text-white-50">Use username <strong>admin</strong> and password <strong>123456</strong> (seeded)</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
