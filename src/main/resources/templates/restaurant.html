<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant - Lodgings Resto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/app.js}"></script>
</head>
<body>
<div class="app-shell">
    <div class="content-shell">
        <header class="topbar"><h1 class="page-title">Restaurant</h1></header>
        <main class="page-body">
            <section class="glass-card">
                <div class="d-flex justify-content-between align-items-center">
                    <h3>Menu</h3>
                    <div>
                        <a href="#addCategory" class="btn btn-outline-light me-2" data-bs-toggle="modal">Add Category</a>
                        <a href="#addItem" class="btn btn-premium" data-bs-toggle="modal">Add Item</a>
                    </div>
                </div>
                <div class="mt-3">
                    <div th:each="c : ${categories}">
                        <h5 th:text="${c.name}">Category</h5>
                        <div class="row g-3">
                            <div class="col-12 col-md-4" th:each="i : ${c.items}">
                                <div class="glass-card p-3">
                                    <div class="d-flex justify-content-between">
                                        <div>
                                            <div class="fw-semibold" th:text="${i.name}">Item</div>
                                            <div class="small text-muted" th:text="${i.description}">Desc</div>
                                        </div>
                                        <div class="text-end">
                                            <div class="fw-bold" th:text="${i.price}">$0</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
</div>

<!-- Modals for category/item (simplified) -->
<div class="modal fade" id="addCategory" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/restaurant/categories}" method="post">
                <div class="modal-header"><h5 class="modal-title">Add Category</h5></div>
                <div class="modal-body"><input type="text" name="name" class="form-control" required/></div>
                <div class="modal-footer"><button class="btn btn-premium" type="submit">Add</button></div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="addItem" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/restaurant/items}" method="post">
                <div class="modal-header"><h5 class="modal-title">Add Item</h5></div>
                <div class="modal-body">
                    <input type="text" name="name" class="form-control mb-2" placeholder="Name" required/>
                    <textarea name="description" class="form-control mb-2" placeholder="Description"></textarea>
                    <input type="number" step="0.01" name="price" class="form-control" placeholder="Price" required/>
                </div>
                <div class="modal-footer"><button class="btn btn-premium" type="submit">Add Item</button></div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
