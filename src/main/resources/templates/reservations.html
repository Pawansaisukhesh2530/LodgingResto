<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservations - Lodgings Resto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/app.js}"></script>
</head>
<body>
<div class="app-shell">
    <div class="content-shell">
        <header class="topbar">
            <div class="d-flex align-items-center gap-3">
                <h1 class="page-title">Reservations</h1>
            </div>
        </header>
        <main class="page-body">
            <section class="glass-card">
                <div class="section-header d-flex justify-content-between align-items-center">
                    <h3>Reservations</h3>
                    <a href="/reservations/new" class="btn btn-premium">Add Reservation</a>
                </div>
                <div class="table-responsive mt-3">
                    <table class="table premium-table">
                        <thead>
                        <tr><th>Guest</th><th>Room</th><th>Check-in</th><th>Check-out</th><th>Guests</th><th>Actions</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="r : ${reservations}">
                            <td th:text="${r.guest.fullName}">Guest</td>
                            <td th:text="${r.room.roomNumber}">Room</td>
                            <td th:text="${r.checkInDate}">2026-01-01</td>
                            <td th:text="${r.checkOutDate}">2026-01-02</td>
                            <td th:text="${r.totalGuests}">1</td>
                            <td>
                                <form th:action="@{/reservations/{id}/delete(id=${r.id})}" method="post">
                                    <button class="btn btn-delete btn-action" type="submit"><i class="fa-solid fa-trash"></i></button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</div>
</body>
</html>
