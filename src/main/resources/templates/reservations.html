<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reservations | Lodgings Resto')}"></head>
<body>
<div class="app-shell">
    <aside class="sidebar collapse d-lg-block" id="sidebarCollapse" th:replace="~{fragments/layout :: sidebar('reservations')}"></aside>
    <div class="content-shell">
        <header th:replace="~{fragments/layout :: topbar('Reservations', @{/reservations}, ${search}, 'Search reservations, guest, room...')}"></header>
        <main class="page-body">
            <section class="glass-card p-4 mb-4">
                <div class="section-header">
                    <div>
                        <div class="eyebrow">Reservation management</div>
                        <h2 class="mb-0">Create booking</h2>
                    </div>
                    <a href="/reservations/new" class="btn btn-premium">Add Reservation</a>
                </div>
                <form th:action="@{/reservations}" th:object="${reservation}" method="post" class="row g-3 mt-1">
                    <div class="col-md-6">
                        <select name="guestId" class="form-select form-select-premium" required>
                            <option value="">Select guest</option>
                            <option th:each="guest : ${guests}" th:value="${guest.id}" th:text="${guest.fullName}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <select name="roomId" class="form-select form-select-premium" required>
                            <option value="">Select room</option>
                            <option th:each="room : ${rooms}" th:value="${room.id}" th:text="${room.roomNumber}"></option>
                        </select>
                    </div>
                    <div class="col-md-4"><input th:field="*{checkInDate}" type="date" class="form-control form-control-premium"></div>
                    <div class="col-md-4"><input th:field="*{checkOutDate}" type="date" class="form-control form-control-premium"></div>
                    <div class="col-md-2"><input th:field="*{totalGuests}" type="number" min="1" class="form-control form-control-premium"></div>
                    <div class="col-md-2"><input th:field="*{paymentStatus}" class="form-control form-control-premium" placeholder="Payment status"></div>
                    <div class="col-12 text-end"><button class="btn btn-premium" type="submit">Save Reservation</button></div>
                </form>
            </section>

            <section class="glass-card p-4">
                <div class="section-header">
                    <div>
                        <div class="eyebrow">Booking history</div>
                        <h2 class="mb-0">All reservations</h2>
                    </div>
                </div>
                <div class="table-responsive premium-table-wrap mt-3">
                    <table class="table premium-table mb-0">
                        <thead>
                        <tr><th>Guest</th><th>Room</th><th>Check-in</th><th>Check-out</th><th>Guests</th><th>Status</th><th>Actions</th></tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(reservations)}"><td colspan="7" class="text-center py-5">No reservations found.</td></tr>
                        <tr th:each="r : ${reservations}">
                            <td data-label="Guest" th:text="${r.guest != null ? r.guest.fullName : '-'}">Guest</td>
                            <td data-label="Room" th:text="${r.room != null ? r.room.roomNumber : '-'}">Room</td>
                            <td data-label="Check-in" th:text="${r.checkInDate}">2026-01-01</td>
                            <td data-label="Check-out" th:text="${r.checkOutDate}">2026-01-02</td>
                            <td data-label="Guests" th:text="${r.totalGuests}">1</td>
                            <td data-label="Status" th:text="${r.paymentStatus}">PENDING</td>
                            <td data-label="Actions">
                                <div class="action-group justify-content-end">
                                    <a th:href="@{/reservations/{id}/edit(id=${r.id})}" class="btn btn-edit btn-action"><i class="fa-solid fa-pen-to-square"></i></a>
                                    <form th:action="@{/reservations/{id}/delete(id=${r.id})}" method="post" onsubmit="return confirm('Delete this reservation?');">
                                        <button class="btn btn-delete btn-action" type="submit"><i class="fa-solid fa-trash"></i></button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: flashToasts}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
