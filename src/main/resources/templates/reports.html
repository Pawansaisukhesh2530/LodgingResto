<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - Lodgings Resto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</head>
<body>
<div class="app-shell">
    <div class="content-shell">
        <header class="topbar"><h1 class="page-title">Reports & Analytics</h1></header>
        <main class="page-body">
            <section class="glass-card">
                <h4>Revenue (last 6 months)</h4>
                <div class="chart-wrap">
                    <canvas id="revenueChart"></canvas>
                </div>
            </section>
        </main>
    </div>
</div>
<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function(){
        const ctx = document.getElementById('revenueChart');
        if (!ctx) return;
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: /*[[${labels}]]*/ ['Jan','Feb','Mar','Apr','May','Jun'],
                datasets: [{
                    label: 'Revenue',
                    data: /*[[${revenueData}]]*/ [1200,1400,1100,1800,1500,2000],
                    borderColor: '#3867ff',
                    backgroundColor: 'rgba(56,103,255,0.12)',
                    tension: 0.3
                }]
            },
            options: { responsive: true }
        });
    });
</script>
</body>
</html>
