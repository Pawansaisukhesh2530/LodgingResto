<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reports | Lodgings Resto')}"></head>
<body>
<div class="app-shell">
    <aside class="sidebar collapse d-lg-block" id="sidebarCollapse" th:replace="~{fragments/layout :: sidebar('reports')}"></aside>
    <div class="content-shell">
        <header th:replace="~{fragments/layout :: topbar('Reports & Analytics', null, null, null)}"></header>
        <main class="page-body">
            <section class="hero-panel mb-4">
                <div>
                    <div class="eyebrow">Performance reports</div>
                    <h2>Revenue analytics & operational metrics</h2>
                    <p class="text-white-50 mb-0 small mt-1">Track gross revenue, monthly trends, and key performance indicators across rooms, restaurant, and billing.</p>
                </div>
                <div class="hero-status">
                    <div class="status-chip"><span class="status-dot bg-success"></span> Live data sync</div>
                    <div class="status-chip"><span class="status-dot bg-warning"></span> Real-time analytics</div>
                </div>
            </section>

            <section class="glass-card p-4">
                <div class="section-header mb-3">
                    <div>
                        <div class="eyebrow">Financial trends</div>
                        <h2 class="mb-0">Monthly revenue chart</h2>
                    </div>
                </div>
                <div class="chart-wrap" style="min-height: 320px;">
                    <canvas id="revenueChart"></canvas>
                </div>
            </section>
        </main>
    </div>
</div>
<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function(){
        const canvas = document.getElementById('revenueChart');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        
        // Premium linear gradient creation
        const gradient = ctx.createLinearGradient(0, 0, 0, 300);
        gradient.addColorStop(0, 'rgba(59, 130, 246, 0.28)');
        gradient.addColorStop(1, 'rgba(59, 130, 246, 0.01)');

        new Chart(ctx, {
            type: 'line',
            data: {
                labels: /*[[${revenueChartLabels}]]*/ [],
                datasets: [{
                    label: 'Monthly Revenue (₹)',
                    data: /*[[${revenueChartValues}]]*/ [],
                    borderColor: '#3b82f6',
                    backgroundColor: gradient,
                    borderWidth: 3.5,
                    tension: 0.38,
                    fill: true,
                    pointBackgroundColor: '#3b82f6',
                    pointHoverRadius: 8
                }]
            },
            options: { 
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        labels: {
                            font: { family: "'Inter', sans-serif", size: 12, weight: '500' },
                            color: '#475569'
                        }
                    },
                    tooltip: {
                        backgroundColor: '#0f172a',
                        titleColor: '#fff',
                        bodyColor: '#e2e8f0',
                        padding: 12,
                        cornerRadius: 8
                    }
                },
                scales: {
                    x: {
                        grid: { color: 'rgba(15, 23, 42, 0.04)' },
                        ticks: { color: '#64748b', font: { family: "'Inter', sans-serif" } }
                    },
                    y: {
                        grid: { color: 'rgba(15, 23, 42, 0.04)' },
                        ticks: { color: '#64748b', font: { family: "'Inter', sans-serif" } }
                    }
                }
            }
        });
    });
</script>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
