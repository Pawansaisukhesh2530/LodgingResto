<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reports | Lodgings Resto')}"></head>
<body>
<div class="app-shell">
    <aside class="sidebar collapse d-lg-block" id="sidebarCollapse" th:replace="~{fragments/layout :: sidebar('reports')}"></aside>
    <div class="content-shell">
        <header th:replace="~{fragments/layout :: topbar('Reports & Analytics', null, null, null)}"></header>
        <main class="page-body">
            <section class="glass-card p-4">
                <div class="section-header mb-3">
                    <div>
                        <div class="eyebrow">Performance reports</div>
                        <h2 class="mb-0">Revenue overview</h2>
                    </div>
                </div>
                <div class="chart-wrap">
                    <canvas id="revenueChart"></canvas>
                </div>
            </section>
        </main>
    </div>
</div>
<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function(){
        const ctx = document.getElementById('revenueChart');
        if (!ctx) return;
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: /*[[${labels}]]*/ ['Jan','Feb','Mar','Apr','May','Jun'],
                datasets: [{
                    label: 'Revenue',
                    data: /*[[${revenueData}]]*/ [1200,1400,1100,1800,1500,2000],
                    borderColor: '#3867ff',
                    backgroundColor: 'rgba(56,103,255,0.12)',
                    tension: 0.3
                }]
            },
            options: { responsive: true }
        });
    });
</script>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
