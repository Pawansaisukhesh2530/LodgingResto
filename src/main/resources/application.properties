spring.application.name=LodgingResto
spring.datasource.url=jdbc:postgresql://localhost:5432/lodgings_db
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

spring.thymeleaf.cache=false


spring.mvc.hiddenmethod.filter.enabled=true

# Silence Spring Security's benign startup info message for the UserDetailsService-based login setup.
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsManagerConfigurer=ERROR

# Run the embedded server on port 8081 to avoid conflicts with other apps
server.port=8081

# GROQ AI Configuration - Real-time Smart Hotel & Restaurant Assistant
groq.api.key=${GROQ_API_KEY:sk-placeholder}
groq.model=llama-3.3-70b-versatile
